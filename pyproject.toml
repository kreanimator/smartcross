[project]
name = "smartcross"
version = "0.1.0"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["ursina==8.3.0", "numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
# torch is held back because newer builds need a newer NVIDIA driver than CUDA 12.4.
vision = ["ultralytics==8.3.246", "torch==2.9.1", "torchvision==0.24.1", "lap>=0.5.12", "opencv-python"]
messaging = ["paho-mqtt==2.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["controller*", "evaluation*", "messaging*", "simulator*", "vision*"]
